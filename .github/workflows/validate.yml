name: Validate
on:
  push:
    branches: [main]
  pull_request:
jobs:
  node-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - run: node --check server.js
      - run: node --check db.js
      - run: node --check public/app.js
      - run: node -e "require('./db'); console.log('SQLite schema OK')"
